services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ksu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ksuevents
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksu -d ksuevents"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage_data:/data

  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://storage:9000 s3 ls >/dev/null 2>&1; do
          echo "waiting for storage..."; sleep 2
        done
        aws --endpoint-url http://storage:9000 s3 mb s3://avatars || true
        aws --endpoint-url http://storage:9000 s3api put-bucket-policy --bucket avatars --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::avatars/*"]}]}'
        echo "bucket avatars ready"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://ksu:${POSTGRES_PASSWORD}@db:5432/ksuevents
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: "true"
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: avatars

volumes:
  pg_data:
  storage_data: